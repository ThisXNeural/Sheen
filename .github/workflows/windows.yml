name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and UI layout (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rust unit tests (platform-independent crates)
        run: cargo test -p sheen-core -p sheen-player --locked

      - name: Type-check the UI
        run: pnpm check

      - name: End-to-end layout tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # to publish releases for version tags
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The Tauri crate embeds the built UI, so build it before compiling tests.
      - name: Build the UI
        run: pnpm build

      - name: Rust tests on Windows (all crates, including Windows services)
        run: cargo test --workspace --locked

      - name: Build installers (NSIS setup.exe and MSI)
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Sheen-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # Pushing a tag like v0.2.0 publishes a GitHub Release with both
      # installers and the notes from docs/releases/<tag>.md.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sheen ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
